[project]
name = "mcp-e2e-harness"
version = "0.1.0"
description = "Generic e2e test harness that drives a model consumer against an arbitrary MCP server and records what happened; it never scores."
requires-python = ">=3.10"
dependencies = [
    "brotli>=1.2.0",
]

[project.scripts]
mcp-e2e = "mcp_e2e_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_e2e_harness"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# Seed code kept verbatim as provenance; not part of the harness (see reference/congressmcp/README.md).
exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
